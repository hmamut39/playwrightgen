name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - hasan_genai

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: playwrightgen_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/playwrightgen_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/playwrightgen_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/playwrightgen_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_only_not_a_real_secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # What actually ships. Development tooling is audited in the next step
      # without failing the build: on 2026-10-12 `braces` carried a high
      # advisory with no patched version in any release, reached only through
      # eslint's plugin chain, so this gate could not be satisfied by any
      # change to this repository. Main had then been red for a day and a
      # half, and every real failure was hiding behind it.
      - name: Audit dependencies that ship
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply test migrations
        run: NODE_ENV=test npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm run test:run

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public browser checks
        run: npm run test:authorization

      - name: Build production application
        run: npm run build
