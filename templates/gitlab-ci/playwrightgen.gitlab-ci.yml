# PlaywrightGen result reporting for GitLab CI
#
# Download this file and playwrightgen-report.mjs from your PlaywrightGen
# project's Repositories tab. Commit the reporter as ci/playwrightgen-report.mjs
# and either use this file as your .gitlab-ci.yml or include it from the one you
# already have:
#
#   include:
#     - local: ci/playwrightgen.gitlab-ci.yml
#
# Your tests run on your own runners, against your own environment, using your
# own variables. PlaywrightGen never executes your code and never receives your
# repository contents - only a bounded summary of results.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   PLAYWRIGHTGEN_TOKEN       Project ingest token, shown in Workspace under the
#                             project's Repositories tab. Mark it Masked, and
#                             Protected if only protected branches should report.
#   PLAYWRIGHTGEN_ORG_ID      Organization UUID, shown next to the token.
#   PLAYWRIGHTGEN_PROJECT_ID  Project UUID, shown next to the token.
#   PLAYWRIGHTGEN_URL         Your PlaywrightGen base URL.
#
# Optional:
#   VERCEL_PROTECTION_BYPASS  Only when the PlaywrightGen deployment sits behind
#                             Vercel Deployment Protection. It gets the request
#                             past the edge check; the ingest endpoint still
#                             requires a valid HMAC signature.

playwrightgen:
  # `test` is one of GitLab's default stages. If your pipeline declares its
  # own stages, change this to one of them or the pipeline will not start.
  stage: test
  # Node rather than a pinned Playwright image, so the browser installed always
  # matches the Playwright version in your own package.json. A pinned image tag
  # that drifts from your dependency is a confusing first failure.
  image: node:20
  timeout: 30 minutes
  variables:
    PLAYWRIGHTGEN_PROVIDER: gitlab_ci
    # Generic names the reporter reads, filled from GitLab's own variables.
    RUN_ID: "$CI_PIPELINE_ID-$CI_JOB_ID"
    RUN_URL: "$CI_JOB_URL"
    COMMIT_SHA: "$CI_COMMIT_SHA"
    REF_NAME: "$CI_COMMIT_REF_NAME"
    # Traces, screenshots and videos live on the runner, which is destroyed when
    # the job ends. The artifacts below give a reviewer opening the failure weeks
    # later somewhere durable to look.
    PLAYWRIGHTGEN_ARTIFACT_URL: "$CI_JOB_URL/artifacts/browse"
    # Which environment this run exercised: LOCAL, DEVELOPMENT, STAGING,
    # PRODUCTION or OTHER. It is recorded with the evidence.
    PLAYWRIGHTGEN_ENVIRONMENT: DEVELOPMENT
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    # A failing run is evidence too, so reporting happens either way and the
    # job's own result is decided at the end.
    - |
      if npx playwright test --reporter=json > playwright-report.json; then
        echo "passed" > .playwrightgen-outcome
      else
        echo "failed" > .playwrightgen-outcome
      fi
    - node ci/playwrightgen-report.mjs
    - test "$(cat .playwrightgen-outcome)" = "passed"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test-results
      - playwright-report
